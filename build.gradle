plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_version}"
}

repositories {
	// Leyline, the library mod split out of this one, from its own repository: build it there with
	// `gradlew publishToMavenLocal` first.
	mavenLocal() {
		content { includeGroup 'dev.leyline' }
	}
	// Nebulon (dynamic lights, rune circles, arcs)
	maven { url = 'https://maven.riftrealms.de/releases' }
	mavenCentral()
	maven {
		name = 'PlayerAnimationLibrary'
		url = 'https://repo.redlance.org/public'
		content {
			includeGroup 'com.zigythebird'
			includeGroup 'com.zigythebird.playeranim'
		}
	}
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content { includeGroup 'software.bernie.geckolib' }
	}
	maven {
		name = 'Ladysnake'
		url = 'https://maven.ladysnake.org/releases'
		content { includeGroup 'org.ladysnake.cardinal-components-api' }
	}
	maven {
		name = 'WispForest'
		url = 'https://maven.wispforest.io'
		content {
			includeGroup 'io.wispforest'
			includeGroup 'io.wispforest.endec'
			includeGroup 'blue.endless'
		}
	}
	maven {
		name = 'OwoKdlParser'
		url = 'https://jitpack.io'
		content { includeGroup 'com.github.kdl-org' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"arcane_spells" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "de.nexusrealms:nebulon:${project.nebulon_version}"
	// Terrain rules, craters and screen effects, shared with other mods. A separate mod, not bundled in this one.
	modImplementation "dev.leyline:leyline:${project.leyline_version}"

	// These are external runtime mods, matching the existing Fabric API/Nebulon install model.
	// Keep Fabric modules on the explicitly selected fabric_api_version rather than mixing older builds.
	modImplementation("com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.player_animation_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
	modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
	modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
	// Ring, necklace and belt slots for the mod's trinkets. It bundles Cardinal Components 7.3.0; the 7.3.2 above wins.
	modImplementation "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	// owo-config generates wrappers from annotated models in either source set.
	annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"
	clientAnnotationProcessor "io.wispforest:owo-lib:${project.owo_version}"
}

processResources {
	def props = [
		version           : project.version,
		loader_version    : project.loader_version,
		// Minimum versions are the ones we build against. Nebulon is a 0.x beta, so `~` also
		// rejects its next minor release, which may break the API.
		fabric_api_version: project.fabric_api_version,
		nebulon_version   : project.nebulon_version,
		leyline_version   : project.leyline_version,
		player_animation_version: project.player_animation_version,
		geckolib_version  : project.geckolib_version,
		cca_version       : project.cca_version,
		owo_version       : project.owo_version,
		trinkets_version  : project.trinkets_version,
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ['-Xlint:deprecation']
}

java {
	// Loom attaches the sources JAR to the build task.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// Uploads the release to Modrinth and CurseForge: `gradlew publishMods`, with MODRINTH_TOKEN and CURSEFORGE_TOKEN set
// (see docs/releasing.md). Without both it's a dry run, which only writes what it would upload to build/publishMods.
publishMods {
	def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN')
	def curseforgeToken = providers.environmentVariable('CURSEFORGE_TOKEN')
	dryRun = !modrinthToken.isPresent() || !curseforgeToken.isPresent()

	file = remapJar.archiveFile
	displayName = "Arcane Spells ${project.version}"
	// 0.x, on a beta Nebulon.
	type = BETA
	modLoaders.add('fabric')
	// This version's section of CHANGELOG.md, without its heading. Publishing fails if there isn't one.
	def releaseVersion = project.version.toString()
	changelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
		def section = text.split(/(?m)^## /).find { it.startsWith(releaseVersion + ' ') || it.startsWith(releaseVersion + '\n') }
		if (section == null) {
			throw new GradleException("CHANGELOG.md has no section for ${releaseVersion}")
		}
		section.substring(section.indexOf('\n') + 1).trim()
	}

	// Every required mod but Nebulon, which is on neither site (see docs/releasing.md). Slugs are the same on both.
	def required = ['fabric-api', 'leyline', 'player-animation-library', 'geckolib', 'cardinal-components-api',
			'owo-lib', 'trinkets-updated']

	modrinth {
		projectId = project.modrinth_project_id
		accessToken = modrinthToken
		minecraftVersions.add(project.minecraft_version)
		additionalFile(remapSourcesJar) {
			type = SOURCES_JAR
		}
		required.each { requires(it) }
	}

	curseforge {
		projectId = project.curseforge_project_id
		accessToken = curseforgeToken
		minecraftVersions.add(project.minecraft_version)
		javaVersions.add(JavaVersion.VERSION_21)
		client = true
		server = true
		required.each { requires(it) }
	}
}

fabricApi {
	// Client game tests live in src/gametest; run with `gradlew runClientGameTest`.
	configureTests {
		createSourceSet = true
		modId = 'arcane_spells_test'
		enableGameTests = false
		enableClientGameTests = true
		// DedicatedServerGameTest runs a dedicated server, which needs the Minecraft EULA accepted:
		// https://aka.ms/MinecraftEULA (accepted by the project owner).
		eula = true
	}
}
