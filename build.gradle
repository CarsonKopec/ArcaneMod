plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Nebulon (dynamic lights, rune circles, arcs)
	maven { url = 'https://maven.riftrealms.de/releases' }
	mavenCentral()
	maven {
		name = 'PlayerAnimationLibrary'
		url = 'https://repo.redlance.org/public'
		content {
			includeGroup 'com.zigythebird'
			includeGroup 'com.zigythebird.playeranim'
		}
	}
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content { includeGroup 'software.bernie.geckolib' }
	}
	maven {
		name = 'Ladysnake'
		url = 'https://maven.ladysnake.org/releases'
		content { includeGroup 'org.ladysnake.cardinal-components-api' }
	}
	maven {
		name = 'WispForest'
		url = 'https://maven.wispforest.io'
		content {
			includeGroup 'io.wispforest'
			includeGroup 'io.wispforest.endec'
			includeGroup 'blue.endless'
		}
	}
	maven {
		name = 'OwoKdlParser'
		url = 'https://jitpack.io'
		content { includeGroup 'com.github.kdl-org' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"arcane_spells" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "de.nexusrealms:nebulon:${project.nebulon_version}"

	// These are external runtime mods, matching the existing Fabric API/Nebulon install model.
	// Keep Fabric modules on the explicitly selected fabric_api_version rather than mixing older builds.
	modImplementation("com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.player_animation_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
	modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
	modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
	// Ring, necklace and belt slots for the mod's trinkets. It bundles Cardinal Components 7.3.0; the 7.3.2 above wins.
	modImplementation "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	// owo-config generates wrappers from annotated models in either source set.
	annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"
	clientAnnotationProcessor "io.wispforest:owo-lib:${project.owo_version}"
}

processResources {
	def props = [
		version           : project.version,
		loader_version    : project.loader_version,
		// Minimum versions are the ones we build against. Nebulon is a 0.x beta, so `~` also
		// rejects its next minor release, which may break the API.
		fabric_api_version: project.fabric_api_version,
		nebulon_version   : project.nebulon_version,
		player_animation_version: project.player_animation_version,
		geckolib_version  : project.geckolib_version,
		cca_version       : project.cca_version,
		owo_version       : project.owo_version,
		trinkets_version  : project.trinkets_version,
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ['-Xlint:deprecation']
}

java {
	// Loom attaches the sources JAR to the build task.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

fabricApi {
	// Client game tests live in src/gametest; run with `gradlew runClientGameTest`.
	configureTests {
		createSourceSet = true
		modId = 'arcane_spells_test'
		enableGameTests = false
		enableClientGameTests = true
		// DedicatedServerGameTest runs a dedicated server, which needs the Minecraft EULA accepted:
		// https://aka.ms/MinecraftEULA (accepted by the project owner).
		eula = true
	}
}
