# Automatically build the project and run any configured tests for every push
# to main and every pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  # Branch pushes are covered by their pull request; listing them here too would build every PR twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        # Caches the Gradle home (dependencies, Loom's Minecraft files) between runs.
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Leyline, the library mod this one builds on, isn't on a public Maven repository yet: build it from its own
      # repository into the local one, where this build looks for it.
      - name: checkout Leyline
        uses: actions/checkout@v6
        with:
          repository: CarsonKopec/Leyline
          path: leyline
      - name: publish Leyline to the local Maven repository
        working-directory: leyline
        run: chmod +x ./gradlew && ./gradlew publishToMavenLocal
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
