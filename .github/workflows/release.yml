# Uploads a release to Modrinth and CurseForge. Run it by hand from the Actions tab once the version, CHANGELOG.md
# and the project IDs in gradle.properties are ready, with the MODRINTH_TOKEN and CURSEFORGE_TOKEN repository secrets
# set. See docs/releasing.md.

name: release
on:
  workflow_dispatch:
    inputs:
      upload_to:
        description: 'Where to upload: both sites, or just one (to retry one that failed without uploading twice to the other)'
        type: choice
        options: [both, modrinth, curseforge]
        default: both
      leyline_ref:
        description: 'Leyline branch or tag to build against'
        default: 'main'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: check tokens
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        # Without both, publishMods only does a dry run, which would look like a release that went nowhere.
        run: |
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::Set the MODRINTH_TOKEN and CURSEFORGE_TOKEN repository secrets first."
            exit 1
          fi
          case "$MODRINTH_TOKEN" in
            mrp_*) ;;
            *) echo "::warning::MODRINTH_TOKEN doesn't start with mrp_, as Modrinth's personal access tokens do: check the secret holds the token itself, with no quotes or spaces." ;;
          esac
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Leyline isn't on a public Maven repository yet: build it from its own repository into the local one, where
      # this build looks for it.
      - name: checkout Leyline
        uses: actions/checkout@v6
        with:
          repository: CarsonKopec/Leyline
          ref: ${{ inputs.leyline_ref }}
          path: leyline
      - name: publish Leyline to the local Maven repository
        working-directory: leyline
        run: chmod +x ./gradlew && ./gradlew publishToMavenLocal
      - name: build and upload
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -o pipefail
          case "${{ inputs.upload_to }}" in
            modrinth) task=publishModrinth ;;
            curseforge) task=publishCurseforge ;;
            *) task=publishMods ;;
          esac
          ./gradlew build "$task" --stacktrace 2>&1 | tee gradle-output.txt
      # Only admins can download a run's log, so put Gradle's own explanation where anyone can read it: an annotation
      # on the run (also readable through the API) and the run's summary.
      - name: report what went wrong
        if: failure()
        run: |
          [ -f gradle-output.txt ] || exit 0
          sed -n '/^\* What went wrong:/,/^\* Try:/p' gradle-output.txt | grep -v '^\* Try:' | head -40 > wrong.txt
          grep -iE 'modrinth|curseforge|http|status|unauthori|forbidden|invalid|exception:' gradle-output.txt \
            | grep -v '^\s*at ' | head -20 > clues.txt || true
          {
            echo '### What went wrong'
            echo '```'
            cat wrong.txt
            echo
            cat clues.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          message=$( (cat wrong.txt; echo; cat clues.txt) | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=What went wrong::${message}"
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
